[project]
name = "fish-speech"
version = "0.1.0"
authors = [
    {name = "Lengyue", email = "lengyue@lengyue.me"},
]
description = "Fish Speech"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["TTS", "Speech"]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy==1.26.4",
    "transformers==4.56.1",
    "datasets==2.18.0",
    "lightning==2.5.5",
    "pytorch-lightning==2.5.5",
    "hydra-core==1.3.2",
    "tensorboard==2.20.0",
    "natsort==8.4.0",
    "einops==0.8.1",
    "librosa==0.11.0",
    "rich==14.1.0",
    "gradio==5.44.1",
    "wandb==0.21.3",
    "grpcio==1.74.0",
    "kui==1.13.0",
    "uvicorn==0.35.0",
    "loguru==0.7.3",
    "loralib==0.1.2",
    "pyrootutils==1.0.4",
    "resampy==0.4.3",
    "einx[torch]==0.2.2",
    "zstandard==0.24.0",
    "pydub==0.25.1",
    "pyaudio==0.2.14",
    "modelscope==1.17.1",
    "opencc-python-reimplemented==0.1.7",
    "silero-vad==6.0.0",
    "ormsgpack==1.10.0",
    "tiktoken==0.11.0",
    "pydantic==2.9.2",
    "cachetools==6.2.0",
    "descript-audio-codec==1.0.0",
    "descript-audiotools==0.7.2",
    "pyyaml==6.0.2",
    "triton==3.5.1"
]

[project.optional-dependencies]
stable = [
  "torch<2.9.0",
  "torchaudio",
]
cpu = [
  "torch>=2.5.1",
  "torchaudio",
]
cu126 = [
  "torch>=2.5.1",
  "torchaudio",
]
cu128 = [
  "torch>=2.5.1",
  "torchaudio",
]
cu129 = [
  "torch>=2.5.1",
  "torchaudio",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu129", extra = "cu129" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true



[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fish_speech", "tools"]

[tool.setuptools_scm]
